"$schema" = 'https://starship.rs/config-schema.json'

# ─── Tokyo Night Moon ────────────────────────────────────────────────
# Palette lifted from the folke/tokyonight.nvim "moon" style so Starship
# matches the rest of the system.
palette = "tokyonight_moon"

# ─── Prompt layout ───────────────────────────────────────────────────
# Two lines: info on top, the ❯ character on its own line below.
format = """
$os\
$directory\
$git_branch\
$git_state\
$git_status\
$golang\
$dotnet\
$nodejs\
$terraform\
$username\
$hostname\
$battery\
${custom.apt_security}\
$line_break\
$character"""

[palettes.tokyonight_moon]
bg = "#222436"
bg_dark = "#1e2030"
bg_highlight = "#2f334d"
terminal_black = "#444a73"
fg = "#c8d3f5"
fg_dark = "#828bb8"
comment = "#636da6"
blue = "#82aaff"
blue0 = "#3e68d7"
blue1 = "#65bcff"
blue2 = "#0db9d7"
blue5 = "#89ddff"
blue6 = "#b4f9f8"
blue7 = "#394b70"
cyan = "#86e1fc"
green = "#c3e88d"
green1 = "#4fd6be"
green2 = "#41a6b5"
teal = "#4fd6be"
magenta = "#c099ff"
magenta2 = "#ff007c"
purple = "#fca7ea"
orange = "#ff966c"
red = "#ff757f"
red1 = "#c53b53"
yellow = "#ffc777"

# ─── Modules ─────────────────────────────────────────────────────────

[os]
disabled = false
style = "fg bold"
format = "[$symbol]($style) "

[os.symbols]
Ubuntu = ""

# Pending apt SECURITY updates. Reads a cached count written by the
# starship-apt-security.timer systemd unit — the prompt NEVER runs apt
# itself, so there's zero latency. Only shows when the count is > 0.
[custom.apt_security]
command = "cat ${XDG_CACHE_HOME:-$HOME/.cache}/starship-apt-security"
when = '''[ "$(cat ${XDG_CACHE_HOME:-$HOME/.cache}/starship-apt-security 2>/dev/null || echo 0)" -gt 0 ]'''
shell = ["bash", "--noprofile", "--norc"]
format = "[| ](comment)[⚠]($style) "
style = "red bold"

[directory]
style = "blue bold"
read_only_style = "red"

[git_branch]
style = "magenta bold"

[git_status]
style = "yellow"

[git_state]
style = "orange bold"

[username]
show_always = true
style_user = "cyan bold"
style_root = "red bold"
format = "[| ](comment)[$user]($style)"

[hostname]
ssh_only = false
style = "green bold"
format = "[@$hostname]($style) "

[battery]
format = "[| ](comment)[$symbol$percentage]($style) "

[[battery.display]]
threshold = 15
style = "red bold"

[[battery.display]]
threshold = 40
style = "orange bold"

[[battery.display]]
threshold = 100
style = "green bold"

[cmd_duration]
style = "yellow bold"

[time]
style = "fg_dark"

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](purple bold)"

# ─── Languages / tooling ─────────────────────────────────────────────

[nodejs]
style = "green bold"
format = "[| ](comment)via [$symbol($version )]($style)"

[python]
style = "yellow bold"

[rust]
style = "orange bold"

[golang]
style = "cyan bold"
format = "[| ](comment)via [$symbol($version )]($style)"

[dotnet]
style = "magenta bold"
format = "[| ](comment)via [$symbol($version )($tfm )]($style)"

[terraform]
style = "purple bold"
format = "[| ](comment)via [$symbol$workspace]($style) "

[docker_context]
style = "blue bold"

[package]
style = "purple bold"
